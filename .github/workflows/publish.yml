name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build components
        run: npm run build:components

      - name: Publish to npm
        run: npm publish --workspace=@bee-ui/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## What's Changed
            
            This release includes updates to the @bee-ui/core package.
            
            ### Installation
            
            ```bash
            npm install @bee-ui/core@latest
            ```
            
            ### Usage
            
            ```tsx
            import { Button, Input, Card } from '@bee-ui/core';
            ```
            
            See the [documentation](https://github.com/${{ github.repository }}) for more details.
          draft: false
          prerelease: false
